# ==========================================
# Frontend Docker Compose Configuration
# ==========================================

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URI: http://localhost:5500
        VITE_APP_NAME: "AI ChatBot"
    container_name: ai-chatbot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
